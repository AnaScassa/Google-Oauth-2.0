services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - proxy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/googleoauth
    networks:
      - proxy

  etcd:
    image: bitnamilegacy/etcd:3.6.4-debian-12-r4
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - proxy

  apisix:
    image: apache/apisix:latest
    depends_on:
      - etcd
      - backend
      - frontend
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml
    networks:
      - proxy

  postgres:
    image: postgres:17
    container_name: googleoauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: googleoauth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"

volumes:
  postgres_data:
  etcd_data:

networks:
  proxy:
    driver: bridge